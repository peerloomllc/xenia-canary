name: Linux Build

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Image'
        required: true
        type: string
      llvm_version:
        description: 'LLVM Version'
        required: true
        type: string
      ubuntu_base:
        description: 'Ubuntu Base'
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk-linux
        uses: actions/cache@v6
        with:
          path: ~/vulkan-sdk
          key: ${{ runner.os }}-vulkan-sdk-latest

      - name: Cache linuxdeploy tools
        id: cache-linuxdeploy
        uses: actions/cache@v6
        with:
          path: ~/linuxdeploy
          key: ${{ runner.os }}-linuxdeploy-tools

      # The job compiles every source file from scratch otherwise, which is
      # most of its wall time. ccache carries the objects between runs and
      # the ThinLTO cache carries the link's per-module work; both fall back
      # to the newest cache of the same kind when this commit has none.
      - name: Cache the compiler output
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ inputs.llvm_version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ inputs.llvm_version }}-

      - name: Cache the ThinLTO work
        uses: actions/cache@v6
        with:
          path: build/thinlto-cache
          key: ${{ runner.os }}-thinlto-${{ inputs.llvm_version }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-thinlto-${{ inputs.llvm_version }}-

      - name: Setup build environment
        run: |-
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo apt-add-repository "deb http://apt.llvm.org/${{ inputs.ubuntu_base }}/ llvm-toolchain-${{ inputs.ubuntu_base }}-${{ inputs.llvm_version }} main"
          sudo apt-get -y update
          # No libc++-dev: the Linux build links libstdc++, and Ubuntu's
          # libc++-dev depends on LLVM's libunwind-NN-dev, which conflicts
          # with the nongnu libunwind-dev the POSIX stack walker links.
          sudo apt-get -y install ccache mesa-vulkan-drivers valgrind libgtk-3-dev libsdl2-dev libvulkan-dev libx11-xcb-dev clang-${{ inputs.llvm_version }} lld-${{ inputs.llvm_version }} spirv-tools libfuse2 libunwind-dev

          # Pin LLVM tools to the correct version so system ar/ranlib/lld
          # don't use the older LLVM 17 gold plugin with clang-20 LTO bitcode
          sudo update-alternatives --install /usr/bin/clang      clang      /usr/bin/clang-${{ inputs.llvm_version }}      200
          sudo update-alternatives --install /usr/bin/clang++    clang++    /usr/bin/clang++-${{ inputs.llvm_version }}    200
          sudo update-alternatives --install /usr/bin/lld        lld        /usr/bin/lld-${{ inputs.llvm_version }}        200
          sudo update-alternatives --install /usr/bin/ld.lld     ld.lld     /usr/bin/ld.lld-${{ inputs.llvm_version }}     200
          sudo update-alternatives --install /usr/bin/llvm-ar    llvm-ar    /usr/bin/llvm-ar-${{ inputs.llvm_version }}    200
          sudo update-alternatives --install /usr/bin/llvm-ranlib llvm-ranlib /usr/bin/llvm-ranlib-${{ inputs.llvm_version }} 200
          sudo update-alternatives --install /usr/bin/llvm-nm    llvm-nm    /usr/bin/llvm-nm-${{ inputs.llvm_version }}    200

          # Download linuxdeploy tools if not cached
          if [ "${{ steps.cache-linuxdeploy.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/linuxdeploy
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O ~/linuxdeploy/linuxdeploy
            chmod +x ~/linuxdeploy/linuxdeploy
          fi
          echo "${HOME}/linuxdeploy" >> $GITHUB_PATH

      - name: Install Vulkan SDK
        run: |-
          if [ "${{ steps.cache-vulkan-sdk-linux.outputs.cache-hit }}" != "true" ]; then
            wget -qO vulkan-sdk.tar.xz https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz
            mkdir -p ~/vulkan-sdk
            tar -xf vulkan-sdk.tar.xz -C ~/vulkan-sdk
          fi

          VULKAN_SDK_VERSION=$(ls ~/vulkan-sdk)
          echo "VULKAN_SDK=${HOME}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64" >> $GITHUB_ENV
          echo "${HOME}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64/bin" >> $GITHUB_PATH

          # Verify shader tools are available
          for tool in glslangValidator spirv-opt spirv-dis; do
            which "$tool" && "$tool" --version 2>/dev/null || echo "Warning: $tool not found"
          done

      - name: Download submodules
        run: |- # Exclude unneeded submodules
          SUBMODULES=$(grep -oP '(?<=path = )(?!third_party\/(?:DirectX(?:-Headers|ShaderCompiler)|xbyak_aarch64)).+' .gitmodules)
          git submodule update --init --depth=1 -j$(getconf _NPROCESSORS_ONLN) $SUBMODULES

      - name: Build Xenia
        env:
          CC: clang-${{ inputs.llvm_version }}
          CXX: clang++-${{ inputs.llvm_version }}
        run: |-
          # 2 GiB each: a repository gets 10 GiB of cache in total, and both
          # of these are uploaded on every run of this job.
          ccache -M 2G
          ccache -z
          ./xenia-build.py build --config=Release \
            --cmake-define CMAKE_C_COMPILER_LAUNCHER=ccache \
            --cmake-define CMAKE_CXX_COMPILER_LAUNCHER=ccache \
            --cmake-define XENIA_THINLTO_CACHE_SIZE=2g
          ccache -s | head -n 8

      - name: Prepare AppImage
        id: prepare_artifacts
        run: |-
          binary=build/bin/Linux/Release/xenia_canary
          if [ $(stat -c%s $binary) -le 100000 ]; then
            echo "::error::Binary is too small."
            exit 1
          fi
          chmod +x $binary

          # Set up AppDir structure
          APPDIR=artifacts/xenia_canary
          mkdir -p ${APPDIR}/usr/bin
          # Install icons
          for size in 16 32 48 64 128 256 512 1024; do
            mkdir -p ${APPDIR}/usr/share/icons/hicolor/${size}x${size}/apps
            cp assets/icon/${size}.png ${APPDIR}/usr/share/icons/hicolor/${size}x${size}/apps/xenia_canary.png
          done

          # Copy any extra runtime data directories alongside the binary
          find build/bin/Linux/Release -maxdepth 1 -type d ! -name Release -exec cp -r {} ${APPDIR}/usr/bin/ \;

          # The build puts the DLSS runtime library in a dlss folder next to
          # the executable, which the directory copy above carries over. Keep
          # it out of usr/bin itself: linuxdeploy runs patchelf over every ELF
          # file there and NGX rejects a modified snippet. Losing it is silent
          # at runtime, so fail the build instead when the SDK is present.
          if ls third_party/nvidia-dlss/lib/Linux_x86_64/rel/libnvidia-ngx-dlss.so.* >/dev/null 2>&1 \
             && ! ls ${APPDIR}/usr/bin/dlss/libnvidia-ngx-dlss.so.* >/dev/null 2>&1; then
            echo "::error::The DLSS SDK is present but its runtime library was not bundled."
            exit 1
          fi

          # Bundle the curated ReShade shader pack next to the binary so the
          # built-in ReShade runtime works out of the box (seeded into the
          # user's shader folder on first run).
          if [ -d assets/reshade-shaders ]; then
            cp -r assets/reshade-shaders ${APPDIR}/usr/bin/reshade-shaders
          fi

          # BSD-3 asks binary distributions to carry the notice.
          cp ${GITHUB_WORKSPACE}/LICENSE ${APPDIR}/LICENSE

          # Embed update information so AppImageUpdate (zsync) can update in
          # place from the latest release's matching .zsync asset.
          owner="${GITHUB_REPOSITORY%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          export UPDATE_INFORMATION="gh-releases-zsync|${owner}|${repo}|latest|xenia_canary_*-x86_64.AppImage.zsync"
          export LDAI_UPDATE_INFORMATION="$UPDATE_INFORMATION"

          # Build AppImage with linuxdeploy (requires absolute paths)
          linuxdeploy --appdir $APPDIR \
            --executable $binary \
            --desktop-file ${GITHUB_WORKSPACE}/assets/xenia_canary.desktop \
            --icon-file ${GITHUB_WORKSPACE}/assets/icon/256.png \
            --output appimage

          # Find the generated AppImage and move to release directory
          appimage_file=$(ls -1 *.AppImage | head -n1)
          if [ -z "$appimage_file" ]; then
            echo "::error::AppImage file not found after linuxdeploy"
            exit 1
          fi

          chmod +x "$appimage_file"
          artifact=xenia_canary_linux.AppImage
          mv "$appimage_file" $artifact
          echo "path=$artifact" >> $GITHUB_OUTPUT

      - name: Upload Xenia Canary artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false

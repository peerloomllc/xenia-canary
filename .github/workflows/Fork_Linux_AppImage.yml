name: Fork Linux AppImage

# peerloomllc fork: build the native-Linux branch on Ubuntu 24.04 (glibc 2.39,
# so the AppImage runs on most current distributions) and attach the AppImage
# to the release of a linux-native-* tag. Reuses the upstream Linux_x86.yml
# job as-is.

on:
  push:
    branches: [linux-native-work]
    tags: ['linux-native-*']
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux (x86-64) AppImage
    uses: ./.github/workflows/Linux_x86.yml
    with:
      runs-on: ubuntu-24.04
      llvm_version: 20
      ubuntu_base: noble

  attach:
    name: Attach AppImage to the release
    needs: [build-linux]
    if: ${{ startsWith(github.ref, 'refs/tags/linux-native-') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the artifact and upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The download-artifact action failed twice on transient blob errors
        # with no retry that helped; the plain API download with retries has
        # been reliable.
        run: |-
          set -e
          id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                 --jq '.artifacts[] | select(.name=="xenia_canary_linux.AppImage") | .id' | head -n1)
          test -n "$id"
          ok=""
          for i in 1 2 3 4 5; do
            if gh api "repos/${{ github.repository }}/actions/artifacts/${id}/zip" > artifact.bin \
               && [ "$(stat -c%s artifact.bin)" -gt 1000000 ]; then
              ok=1; break
            fi
            echo "download attempt $i failed; retrying in 20 s"
            sleep 20
          done
          test -n "$ok"
          # The artifact was uploaded unarchived; the API may still wrap it.
          if [ "$(head -c2 artifact.bin)" = "PK" ]; then
            unzip -o artifact.bin -d extracted
            file=$(find extracted -name '*.AppImage' -o -name 'xenia_canary_linux*' | head -n1)
          else
            file=artifact.bin
          fi
          test -n "$file"
          name="xenia_canary_${{ github.ref_name }}-x86_64.AppImage"
          mv "$file" "$name"
          chmod +x "$name"
          sha256sum "$name" > "$name.sha256"
          gh release upload "${{ github.ref_name }}" "$name" "$name.sha256" \
            --repo "${{ github.repository }}" --clobber

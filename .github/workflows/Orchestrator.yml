name: Orchestrator

on:
  push:
    # peerloomllc fork: the native-Linux branch has its own workflow
    # (Fork_Linux_AppImage.yml); the upstream checks run on PR branches.
    branches-ignore:
      - linux-native-work
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Pre-requirements
  # ===========================================================================
  commit-message:
    name: Commit Message Validation
    if: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/Check_commit_message.yml

  lint:
    name: Lint
    uses: ./.github/workflows/Lint.yml
    with:
      runs-on: ubuntu-24.04
      llvm_version: 20

  # Add optional steps here

  # ===========================================================================
  # Stage 2: Platform builds
  # ===========================================================================
  # No Windows build. This fork is native-Linux work and ships Linux releases
  # only; Windows users are served by upstream xenia-canary, where these
  # changes go as individual pull requests and are built there. The check had
  # been skipped for a week behind a failing Lint (fixed in #37), and when it
  # finally ran it found five unrelated breaks dating back to 2026-08-30 -
  # four fixed in this pull request, a sixth in third_party/soundtouch left
  # standing. A check nobody keeps green hides the ones that matter, which is
  # exactly what happened here. Windows_x86.yml is still in the tree, so
  # re-adding this is four lines.

  build-linux:
    name: Linux (x86-64)
    needs: [lint, commit-message]
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/Linux_x86.yml
    with:
      runs-on: ${{ needs.lint.outputs.runs-on }}
      llvm_version: ${{ needs.lint.outputs.llvm_version }}
      ubuntu_base: ${{ needs.lint.outputs.ubuntu_base }}

  # Uncomment when platform support is ready:
  # build-windows-arm64:
  #   name: Windows-ARM64
  #   needs: [lint]
  #   uses: ./.github/workflows/build-win_arm64.yml

  # build-linux-arm64:
  #   name: Linux-ARM64
  #   needs: [lint]
  #   uses: ./.github/workflows/build-linux_arm64.yml

  # build-macos:
  #   name: macOS
  #   needs: [lint]
  #   uses: ./.github/workflows/build-macos.yml

  # build-android:
  #   name: Android
  #   needs: [lint]
  #   uses: ./.github/workflows/build-android.yml

  # ===========================================================================
  # Stage 3: Release
  # ===========================================================================
  release:
    name: Create Release
    needs: [build-windows, build-linux]
    if: |-
      always() &&
      github.repository == 'xenia-canary/xenia-canary' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/canary_experimental' &&
      (needs.build-windows.result == 'success' && needs.build-linux.result == 'success')
    uses: ./.github/workflows/Create_release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ github.sha }}
      branch: ${{ github.ref_name }}

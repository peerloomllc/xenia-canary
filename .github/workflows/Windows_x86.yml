name: Windows (x86-64)

on:
  workflow_call:

jobs:
  build:
    name: Build
    runs-on: windows-2025-vs2026

    env:
      POWERSHELL_TELEMETRY_OPTOUT: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Cache Vulkan SDK
        id: cache-vulkan-sdk
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK
          key: ${{ runner.os }}-vulkan-sdk-${{ hashFiles('**/vulkan-sdk.exe') }}
          restore-keys: ${{ runner.os }}-vulkan-sdk-

      - name: Install Vulkan SDK with spirv-tools
        run: |-
          if (Test-Path "C:\VulkanSDK") {
            echo "Vulkan SDK found in cache."
          } else {
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" -OutFile "vulkan-sdk.exe"
            Start-Process -FilePath "vulkan-sdk.exe" -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -NoNewWindow -Wait
          }
          $env:VULKAN_SDK = "C:\VulkanSDK\$(Get-ChildItem -Path 'C:\VulkanSDK' -Directory | Select-Object -First 1 -ExpandProperty Name)"
          $env:PATH += "${env:VULKAN_SDK}\Bin"
          echo "VULKAN_SDK=$env:VULKAN_SDK" >> $env:GITHUB_ENV
          echo "${env:VULKAN_SDK}\Bin" >> $env:GITHUB_PATH

          # Verify shader tools are available
          foreach ($tool in @("glslangValidator", "spirv-opt", "spirv-dis")) {
            $toolPath = "${env:VULKAN_SDK}\Bin\${tool}.exe"
            if (Test-Path "$toolPath") {
              echo "$tool found at: $toolPath"
              & $toolPath --version 2>$null
            } else {
              echo "Warning: ${tool}.exe not found at expected location"
            }
          }

          # Verify FXC is available (from Windows SDK)
          $fxcPaths = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" -ErrorAction SilentlyContinue | Sort-Object FullName
          if ($fxcPaths) {
            $fxcPath = $fxcPaths[-1].FullName
            echo "FXC found at: $fxcPath"
          } else {
            echo "Warning: fxc.exe not found in Windows SDK"
          }

      - name: Download submodules
        run: |- # Exclude unneeded submodules
          $SUBMODULES=(Select-String -CaseSensitive '(?<=path = )(?!third_party\/xbyak_aarch64).+' .gitmodules).Matches.Value
          git submodule update --init --depth=1 -j $env:NUMBER_OF_PROCESSORS $SUBMODULES

      - name: Cache GTK3
        id: cache-gtk3
        uses: actions/cache@v6
        with:
          path: C:\gtk3
          key: gtk3-gvsbuild-2026.8.0

      # The Settings window and game library are GTK, as on Linux.
      - name: Download GTK3 (gvsbuild)
        if: steps.cache-gtk3.outputs.cache-hit != 'true'
        run: |-
          Invoke-WebRequest -Uri "https://github.com/wingtk/gvsbuild/releases/download/2026.8.0/GTK3_Gvsbuild_2026.8.0_x64.zip" -OutFile gtk3.zip
          $hash = (Get-FileHash gtk3.zip -Algorithm SHA256).Hash
          if ($hash -ne "9BE43D9029749062D2637070C856E73F8A1327A72259D08326B38155C139ECDC") {
            echo "::error:: GTK3 zip hash $hash does not match."
            exit 1
          }
          7z x gtk3.zip -oC:\gtk3 "bin\*.dll" "lib\*" "include\*" "share\icons\*" "share\glib-2.0\*" "share\doc\*" "-xr!gtk-4.0" -y -bso0
          Remove-Item gtk3.zip

      - name: Build Xenia
        env:
          XE_GTK3_ROOT: C:\gtk3
        run: python xenia-build.py build --config=Release --target=xenia-app

      - name: Prepare artifacts
        id: prepare_artifacts
        run: |-
          if ((Get-Item "build\bin\Windows\Release\xenia_canary.exe").Length -le 100000) {
            echo "::error:: Executable is too small."
            exit 1
          }
          $path="xenia_canary_windows.7z"
          7z a $path .\build\bin\Windows\Release\xenia_canary.exe .\build\bin\Windows\Release\*.dll .\build\bin\Windows\Release\share LICENSE -mx9 -bb1
          if ((Get-Item "$path").Length -le 100000) {
            echo "::error:: Archive is too small."
            exit 1
          }
          echo "path=$path" >> $env:GITHUB_OUTPUT

      # Symbols, so a crash offset from a user's machine can be turned into
      # a function and line.
      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: xenia_canary_windows_pdb
          path: build/bin/Windows/Release/xenia_canary.pdb
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Xenia Canary artifact
        if: ${{ steps.prepare_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.prepare_artifacts.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          archive: false

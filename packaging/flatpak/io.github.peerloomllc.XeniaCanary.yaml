# Xenia Canary, the peerloomllc native-Linux fork.
#
# Built against the GNOME runtime rather than the freedesktop one because the
# build hard-requires GTK 3 (`pkg_check_modules(GTK3 REQUIRED gtk+-x11-3.0)`),
# which freedesktop does not carry. See notes/82.
app-id: io.github.peerloomllc.XeniaCanary
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: xenia-canary

build-options:
  append-path: /usr/lib/sdk/llvm22/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
  env:
    CC: clang
    CXX: clang++

finish-args:
  # The build forces GDK_BACKEND=x11, which is XWayland under gamescope.
  - --socket=x11
  - --share=ipc
  - --socket=pulseaudio
  # GPU, controllers, and raw USB for the guitar driver.
  - --device=all
  # The Patches tab looks up and downloads community patches.
  - --share=network
  # Games, content and save states, all writable and anywhere the user likes.
  #
  # `home` alone is not enough and the first real install proved it: games on
  # a second drive (/new_volume here) were invisible, so the library came up
  # empty. A second internal drive is the normal way to keep 100 GB of discs,
  # so the app has to be able to reach one wherever it is mounted.
  - --filesystem=host
  # An SD card on a Steam Deck.
  - --filesystem=/run/media
  - --filesystem=/media
  # Gaming mode.
  - --filesystem=xdg-run/gamescope-0

modules:
  # The POSIX stack walker links this; the runtime does not carry it.
  - name: libunwind
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-tests
      - --disable-documentation
    sources:
      - type: archive
        url: https://github.com/libunwind/libunwind/releases/download/v1.8.1/libunwind-1.8.1.tar.gz
        sha256: ddf0e32dd5fafe5283198d37e4bf9decf7ba1770b6e7e006c33e6df79e6a6157
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'

  # Our CMake builds SDL2 from source only on Windows and links the system one
  # on Linux, and no runtime carries SDL2.
  - name: sdl2
    buildsystem: cmake-ninja
    # SDL refuses to configure inside its own source directory.
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_STATIC=OFF
      - -DSDL_TEST=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.32.8/SDL2-2.32.8.tar.gz
        sha256: 0ca83e9c9b31e18288c7ec811108e58bac1f1bb5ec6577ad386830eac51c787e
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /bin

  # The build runs spirv-opt and glslangValidator over its shaders. Fedora
  # ships them; no Flatpak runtime does.
  - name: spirv-headers
    buildsystem: cmake-ninja
    builddir: true
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Headers.git
        tag: vulkan-sdk-1.4.357.0
        commit: 29981f65241605e08b0ede4cfeb999fe3b723c6a
    cleanup:
      - '*'

  - name: spirv-tools
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSPIRV_SKIP_TESTS=ON
      - -DSPIRV_WERROR=OFF
      - -DSPIRV-Headers_SOURCE_DIR=/app
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Tools.git
        tag: vulkan-sdk-1.4.357.0
        commit: 9a49b0883b9b635689a85b5647dbfcb223268151
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig

  - name: glslang
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DENABLE_OPT=OFF
    sources:
      - type: git
        url: https://github.com/KhronosGroup/glslang.git
        tag: vulkan-sdk-1.4.357.0
        commit: 168d452a4f460d24b588fed08477a81c44ee27a1
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig

  - name: xenia-canary
    buildsystem: simple
    build-options:
      env:
        # The SDK's clang is newer than the one our own CI builds with, and
        # it treats a handful of ignored return values as errors. They are
        # worth fixing in the tree (TODO.md), but a packaging build should
        # not be the thing that blocks on them.
        CFLAGS: -Wno-error=unused-result
        CXXFLAGS: -Wno-error=unused-result
    build-commands:
      - ./xenia-build.py build --config=Release
      - install -Dm755 build/bin/Linux/Release/xenia_canary /app/bin/xenia_canary
      - install -Dm755 xenia-canary.sh /app/bin/xenia-canary
      - install -Dm644 assets/icon/256.png
        /app/share/icons/hicolor/256x256/apps/io.github.peerloomllc.XeniaCanary.png
      - install -Dm644 io.github.peerloomllc.XeniaCanary.desktop
        /app/share/applications/io.github.peerloomllc.XeniaCanary.desktop
      - install -Dm644 io.github.peerloomllc.XeniaCanary.metainfo.xml
        /app/share/metainfo/io.github.peerloomllc.XeniaCanary.metainfo.xml
    sources:
      # A `git` source clones every submodule, including the ones this build
      # never compiles: our own CI excludes DirectXShaderCompiler (an LLVM
      # fork), DirectX-Headers and xbyak_aarch64 for that reason. Left to
      # itself flatpak-builder spends gigabytes and a long time on them.
      #
      # So the source is this checked out tree, with those three skipped,
      # which is also what the AppImage build does.
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - .flatpak-builder
          - third_party/DirectXShaderCompiler
          - third_party/DirectX-Headers
          - third_party/xbyak_aarch64
      - type: file
        path: xenia-canary.sh
      - type: file
        path: io.github.peerloomllc.XeniaCanary.desktop
      - type: file
        path: io.github.peerloomllc.XeniaCanary.metainfo.xml
